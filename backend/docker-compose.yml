services:
  backend:
    build: .
    volumes:
      - ./models:/app/models
    restart: always
    ports:
      - "8000:8000"

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/ssl/certs:ro
    depends_on:
      - backend
