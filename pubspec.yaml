name: silent_sos
description: Emergency SOS app with location sharing.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Using flexible caret versions to ensure compatibility
  firebase_core: ^4.2.0
  firebase_crashlytics: ^5.0.3
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  flutter_contacts: ^1.1.7+1
  sensors_plus: ^7.0.0
  # Bump vibration plugin to a modern version that uses v2 embedding and AndroidX-compatible code
  vibration: ^3.1.4
  # bumped to a newer major version to be compatible with recent Android Gradle Plugin
  # (fixes missing namespace issues in older versions)
  flutter_foreground_task: ^9.1.0
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^19.5.0
  google_maps_flutter: ^2.6.1
  camera: ^0.10.0+5
  path_provider: ^2.0.15
  path: ^1.8.2
  # bumped to a newer version compatible with firebase_core ^4.x series
  firebase_storage: ^13.0.3
  firebase_auth: ^6.1.2
  share_plus: ^12.0.1
  http: ^1.1.0
  record: ^4.4.0
  image_picker: ^0.8.7+5
  # Upgrade file_picker to a modern v2-embedding compatible release to avoid v1 Registrar
  # compilation errors during Android builds.
  file_picker: ^10.3.3
  # TFLite model inference support
  tflite_flutter: ^0.9.0
  image: ^3.0.2
  # Lottie animations for onboarding and SOS animations
  lottie: ^2.4.2
  # Speech-to-text for push-to-talk MVP
  speech_to_text: ^7.3.0
  flutter_sound: ^9.2.13
  # Lightweight audio recording plugin removed to avoid Android Gradle Plugin
  # namespace errors in third-party plugin modules during release builds.
  # Recording is handled via the native foreground service (MethodChannel)
  # when `allow_auto_audio` is enabled. Re-add `record` if you need a
  # Dart/foreground-only fallback and when a plugin patch with namespace is
  # available.
  # Schedule headless background Dart tasks (WorkManager)
  workmanager: ^0.9.0+3
  # Coachmark / showcase for per-element tutorials
  # (coachmark package intentionally omitted to avoid version resolution issues during this pass)
  # FFmpeg disabled in this build due to native artifact availability; mergeVideos
  # will fall back to uploading both clips separately. To enable merging,
  # add an ffmpeg_kit variant that is available for your Android repo.
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/models/injury_detector.tflite
    - assets/models/labels.txt

