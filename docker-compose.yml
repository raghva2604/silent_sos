version: '3.8'

services:
  # Node.js backend for email/SMS alerts and recording uploads
  backend_server:
    build:
      context: ./backend_server
      dockerfile: Dockerfile.node
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      # Optional: set SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS for production email
      # Otherwise uses Ethereal test account (links printed to logs)
    volumes:
      - ./backend_server/uploads:/app/uploads
    command: npm start

  # FastAPI inference backend for transcription and text/image classification
  backend_inference:
    build:
      context: ./backend_inference
    ports:
      - "8000:8000"
    environment:
      WHISPER_MODEL: "small"  # can be tiny, small, medium, large
    command: python app.py
    # Note: first run may download models (~1GB for Whisper "small");
    # add volume for model caching if needed:
    # volumes:
    #   - ./models:/root/.cache/huggingface

volumes:
  uploads:
